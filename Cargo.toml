[package]
name = "rust-api"
version = "1.0.0"
edition = "2024"


[dependencies]
tokio-postgres = { version = "0.7.13", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
redis = { version = "1", features = ["tokio-comp"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postgres-native-tls = "0.5"
env_logger = "0.11.6"
actix-web = "4.13.0"
actix-cors = "0.7.1"
deadpool = "0.12.2"
serde_json = "1.0"
native-tls = "0.2"
bcrypt = "0.18.0"
base64 = "0.22"
tokio = "1.52"
rand = "0.10"
sha1 = "0.11"
log = "0.4"


[profile.release]
overflow-checks = true
codegen-units = 1
panic = "abort"
opt-level = 3
debug = false
strip = true
lto = "fat"
